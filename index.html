<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kim Willcott</title>
  <meta name="description" content="Academic homepage">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="band">
  <!-- Ice shelf schematic (direct child of .band, outside .hero) -->
  <svg class="scene" viewBox="0 0 240 150" aria-hidden="true">
    <path d="M0,14 C45,18 95,42 150,44 V74 C115,80 80,98 40,112 C28,118 15,126 0,130"/>
    <path d="M40,112 C100,112 160,110 200,104 S235,98 240,96"/>
    <path d="M150,52 q7.5,-4 15,0 t15,0 t15,0 t15,0 t15,0 t15,0"/>
    <path d="M186,52 H206 M212,52 H234"/>
    <rect x="155" y="44" width="14" height="22" rx="2"/>
  </svg>

  <div class="hero">
    <div>
      <h1></h1>
      <p class="role"></p>
      <p class="affil"></p>
      <p class="links"></p>
    </div>
  </div>

  <!-- Wavy bottom edge -->
  <svg class="wave" viewBox="0 0 1440 48" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,48H1440V24C1320,4 1200,4 1080,24C960,44 840,44 720,24C600,4 480,4 360,24C240,44 120,44 0,24Z"/>
  </svg>
</header>

<main>
  <nav class="tabs" aria-label="Sections">
    <a href="#about" aria-current="page">About</a>
    <a href="#research">Research</a>
    <a href="#experience">Experience</a>
    <a href="#education">Education</a>
  </nav>

  <section id="about"><h2>About</h2></section>
  <section id="research"><h2>Research</h2></section>
  <section id="experience"><h2>Experience</h2></section>
  <section id="education"><h2>Education</h2></section>
</main>

<footer></footer>

<!-- All of the page's text lives in content.js (defines SITE) -->
<script src="content.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  };

  /* ---------- Header ---------- */
  document.title = SITE.name;
  $('h1').textContent = SITE.name;
  $('.role').textContent = SITE.title || '';
  $('.affil').textContent = SITE.affiliation || '';
  if (!SITE.title) $('.role').hidden = true;
  if (!SITE.affiliation) $('.affil').hidden = true;

  const L = SITE.links || {};
  const linkDefs = [
    ['email', 'Email', v => 'mailto:' + v],
    ['cv', 'CV'],
    ['scholar', 'Google Scholar'],
    ['orcid', 'ORCID'],
    ['linkedin', 'LinkedIn'],
    ['github', 'GitHub']
  ];
  const linkBox = $('.links');
  linkDefs.forEach(([key, label, fmt]) => {
    const v = L[key];
    if (!v) return;
    const a = el('a', '', label);
    a.href = fmt ? fmt(v) : v;
    if (/^https?:/.test(v)) { a.target = '_blank'; a.rel = 'noopener'; }
    linkBox.append(a);
  });
  if (!linkBox.children.length) linkBox.hidden = true;

  /* ---------- Sections (empty ones are removed, along with their nav link) ---------- */
  function fill(id, items, build) {
    const sec = document.getElementById(id);
    const list = (items || []).filter(Boolean);
    if (!list.length) {
      sec.remove();
      const link = document.querySelector('.tabs a[href="#' + id + '"]');
      if (link) link.remove();
      return;
    }
    build(sec, list);
  }

  const timeline = (sec, items) => {
    const t = el('div', 'timeline');
    items.forEach(r => {
      const row = el('div', 'row');
      if (r.dates) row.append(el('span', 'dates', r.dates));
      row.append(el('strong', '', r.role || ''));
      if (r.org) row.append(el('span', 'org', r.org));
      if (r.text) row.append(el('p', '', r.text));
      t.append(row);
    });
    sec.append(t);
  };

  fill('about', SITE.about, (sec, items) =>
    items.forEach(t => sec.append(el('p', '', t))));

  fill('research', SITE.research, (sec, items) =>
    items.forEach(r => {
      const d = el('div', 'item');
      d.append(el('h3', '', r.title || ''));
      if (r.text) d.append(el('p', '', r.text));
      sec.append(d);
    }));

  fill('experience', SITE.experience, timeline);
  fill('education', SITE.education, timeline);

  $('footer').textContent = '\u00A9 ' + SITE.name;

  /* ---------- Highlight the nav link for the section in view ---------- */
  const links = [...document.querySelectorAll('.tabs a')];
  const sections = links.map(a => document.querySelector(a.getAttribute('href')));
  if (links[0]) links[0].setAttribute('aria-current', 'page');
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(l => l.removeAttribute('aria-current'));
      links[sections.indexOf(e.target)].setAttribute('aria-current', 'page');
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  sections.forEach(s => s && io.observe(s));
})();
</script>
</body>
</html>
