<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name</title>
<meta name="description" content="Academic homepage">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="band">
  <div class="hero">
    <div>
      <h1 id="name"></h1>
      <p class="role" id="title"></p>
      <p class="affil" id="affiliation"></p>
      <p class="links" id="links"></p>
    </div>
    <svg class="grid" viewBox="0 0 120 120" aria-hidden="true">
      <g id="boxes"></g>
      <path class="loop" d="M20 100 V60 H60 V20 H100 V60" fill="none"/>
      <path class="head" d="M95 54 L100 61 L105 54" fill="none"/>
    </svg>
  </div>
  <svg class="wave" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 34 C 200 62 440 4 720 30 S 1200 58 1440 20 V60 H0 Z"/></svg>
</header>

<main>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#about">About</a>
    <a href="#research">Research</a>
    <a href="#experience">Experience</a>
  </nav>

  <section id="about"><h2>About</h2><div id="about-body"></div></section>
  <section id="research"><h2>Research</h2><div id="research-body"></div></section>
  <section id="experience">
    <h2>Experience</h2><div id="experience-body" class="timeline"></div>
    <h2 class="sub">Education</h2><div id="education-body" class="timeline"></div>
  </section>
</main>

<footer><span id="foot"></span></footer>

<script src="content.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }
  function link(label, href) {
    var a = el("a", "", label);
    a.href = href;
    if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
    return a;
  }

  document.title = SITE.name;
  $("name").textContent = SITE.name;
  $("title").textContent = SITE.title;
  $("affiliation").textContent = SITE.affiliation;
  $("foot").textContent = "\u00A9 " + new Date().getFullYear() + " " + SITE.name;

  // Link row
  var L = SITE.links, labels = [
    ["github", "GitHub"], ["linkedin", "LinkedIn"], ["orcid", "ORCID"],
    ["scholar", "Google Scholar"], ["cv", "CV"], ["email", "Email"]
  ];
  var row = $("links");
  labels.forEach(function (p) {
    if (!L[p[0]]) return;
    var href = p[0] === "email" ? "mailto:" + L.email : L[p[0]];
    row.appendChild(link(p[1], href));
  });

  // About
  SITE.about.forEach(function (t) { $("about-body").appendChild(el("p", "", t)); });

  // Research
  SITE.research.forEach(function (r) {
    var d = el("div", "item");
    d.appendChild(el("h3", "", r.title));
    d.appendChild(el("p", "", r.text));
    $("research-body").appendChild(d);
  });

  // Timelines
  function timeline(list, target) {
    list.forEach(function (x) {
      var d = el("div", "row");
      d.appendChild(el("span", "dates", x.dates));
      var b = el("div");
      b.appendChild(el("strong", "", x.role));
      b.appendChild(el("span", "org", x.org));
      if (x.text) b.appendChild(el("p", "", x.text));
      d.appendChild(b);
      $(target).appendChild(d);
    });
  }
  timeline(SITE.experience, "experience-body");
  timeline(SITE.education, "education-body");

  // Tabs: show one panel at a time, driven by the URL hash (#about, #research, #experience)
  var tabs = Array.prototype.slice.call(document.querySelectorAll("#tabs a"));
  var panels = tabs.map(function (t) { return $(t.getAttribute("href").slice(1)); });
  function show() {
    var id = location.hash.slice(1);
    if (!panels.some(function (p) { return p.id === id; })) id = panels[0].id;
    panels.forEach(function (p) { p.hidden = p.id !== id; });
    tabs.forEach(function (t) {
      var on = t.getAttribute("href") === "#" + id;
      if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
  }
  window.addEventListener("hashchange", function () { show(); window.scrollTo(0, 0); });
  show();

  // Nine-box motif
  var g = $("boxes"), ns = "http://www.w3.org/2000/svg";
  for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) {
    var rect = document.createElementNS(ns, "rect");
    rect.setAttribute("x", 6 + c * 40); rect.setAttribute("y", 6 + r * 40);
    rect.setAttribute("width", 28); rect.setAttribute("height", 28); rect.setAttribute("rx", 3);
    g.appendChild(rect);
  }
})();
</script>
</body>
</html>
